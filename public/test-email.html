<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de correo</title>
</head>
<body style="margin:0;padding:24px;background:#f2f2f2;font-family:Arial,sans-serif;">
  <!-- Simula el <img> del correo. Abre este archivo con el servidor corriendo (npm run dev). -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr><td align="center">
      <table role="presentation" width="668" cellpadding="0" cellspacing="0" style="max-width:668px;width:100%;background:#fff;">
        <tr><td>
          <img src="http://localhost:3000/?km=20566" width="668" height="332"
               alt="Este año recorriste 20,566 kilómetros con Viva"
               style="display:block;border:0;width:100%;max-width:668px;height:auto;">
        </td></tr>
        <tr><td>
          <img src="http://localhost:3000/?km=7" width="668" height="332"
               alt="Este año recorriste 7 kilómetros con Viva"
               style="display:block;border:0;width:100%;max-width:668px;height:auto;">
        </td></tr>
        <tr><td>
          <img src="http://localhost:3000/?km=abc" width="668" height="332"
               alt="Este año viajaste con Viva"
               style="display:block;border:0;width:100%;max-width:668px;height:auto;">
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
